name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

# Allow the deploy job to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deployment; let in-progress runs finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run fmt:check

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run tests
        run: bun run test --project=chromium

      - name: Type check
        run: bun run typecheck

      - name: Build
        run: bun run build
        env:
          # Serve from https://<owner>.github.io/<repo>/
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: Prepare Pages artifact
        run: |
          repo="${{ github.event.repository.name }}"
          # With a basename, the page is prerendered to build/client/<repo>/.
          # GitHub Pages already serves the artifact root at /<repo>/, so lift
          # the HTML up one level. Assets are already referenced as /<repo>/...
          if [ -f "build/client/$repo/index.html" ]; then
            mv "build/client/$repo/index.html" build/client/index.html
            rmdir "build/client/$repo" 2>/dev/null || true
          fi
          # SPA fallback so deep links / unknown routes load the app.
          cp build/client/index.html build/client/404.html

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/client

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
